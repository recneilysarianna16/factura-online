<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARI FASHION - Sistema de Cotizaciones</title>
  
  <!-- Carga de Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Carga de React, ReactDOM y Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Carga de librerías para exportar PDF e Imagen -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function App() {
      const [isPreview, setIsPreview] = useState(false);
      const [currency, setCurrency] = useState('USD');
      const [exchangeRate, setExchangeRate] = useState(56.50);
      const [isExporting, setIsExporting] = useState(false);

      const [logoUrl, setLogoUrl] = useState('');
      const [invoiceNumber, setInvoiceNumber] = useState('0001');
      const [invoiceDate, setInvoiceDate] = useState(new Date().toISOString().split('T')[0]);
      const [dueDate, setDueDate] = useState('');

      const [clientName, setClientName] = useState('');
      const [clientDoc, setClientDoc] = useState('');
      const [clientPhone, setClientPhone] = useState('');
      const [clientAddress, setClientAddress] = useState('');

      const [items, setItems] = useState([
        { id: 1, title: '', description: '', quantity: 1, price: 0 }
      ]);

      const [discountPercent, setDiscountPercent] = useState(0);
      const [notes, setNotes] = useState('');
      const [paymentInfo, setPaymentInfo] = useState('');

      const invoiceRef = useRef(null);

      const subtotalUSD = items.reduce((sum, item) => sum + (Number(item.quantity) * Number(item.price) || 0), 0);
      const discountUSD = (subtotalUSD * (Number(discountPercent) || 0)) / 100;
      const totalUSD = subtotalUSD - discountUSD;

      const rate = Number(exchangeRate) || 1;
      const subtotalVES = subtotalUSD * rate;
      const discountVES = discountUSD * rate;
      const totalVES = totalUSD * rate;

      const handleAddItem = () => {
        setItems([...items, { id: Date.now(), title: '', description: '', quantity: 1, price: 0 }]);
      };

      const handleRemoveItem = (id) => {
        if (items.length === 1) return;
        setItems(items.filter(item => item.id !== id));
      };

      const handleItemChange = (id, field, value) => {
        setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setLogoUrl(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const formatUSD = (val) => `$ ${Number(val || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      const formatVES = (val) => `Bs. ${Number(val || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

      const renderMoney = (amountUSD, amountVES) => {
        return currency === 'USD' ? (
          <div>
            <span className="font-bold">{formatUSD(amountUSD)}</span>
            <div className="text-[10px] text-slate-500 font-normal">Eqv: {formatVES(amountVES)}</div>
          </div>
        ) : (
          <div>
            <span className="font-bold">{formatVES(amountVES)}</span>
            <div className="text-[10px] text-slate-500 font-normal">Eqv: {formatUSD(amountUSD)}</div>
          </div>
        );
      };

      const exportAsPDF = async () => {
        if (!invoiceRef.current) return;
        const html2canvasLib = window.html2canvas;
        const jsPDFClass = window.jspdf ? window.jspdf.jsPDF : window.jsPDF;
        if (!html2canvasLib || !jsPDFClass) return;

        setIsExporting(true);
        try {
          const canvas = await html2canvasLib(invoiceRef.current, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
          const imgData = canvas.toDataURL('image/png');
          const pdf = new jsPDFClass('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = pdf.internal.pageSize.getHeight();
          pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
          pdf.save(`Factura_Ari_Fashion_${invoiceNumber || 'SN'}.pdf`);
        } catch (err) {
          console.error('Error al generar PDF:', err);
        } finally {
          setIsExporting(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800">
          {!isPreview && (
            <header className="bg-white border-b border-pink-100 shadow-sm sticky top-0 z-30 p-4">
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h1 className="text-xl font-bold text-slate-900 font-serif">ARI FASHION</h1>
                  <p className="text-xs text-pink-600 font-medium tracking-widest uppercase">belleza, moda y estilo</p>
                </div>
                <div className="flex items-center space-x-3 text-xs sm:text-sm">
                  <span className="text-slate-500 font-medium">Tasa BCV: Bs.</span>
                  <input type="number" step="0.01" value={exchangeRate} onChange={(e) => setExchangeRate(e.target.value)} className="w-20 border border-slate-200 rounded px-2 py-1 font-semibold text-right" />
                  <div className="bg-slate-100 p-1 rounded flex border">
                    <button onClick={() => setCurrency('USD')} className={`px-2 py-1 text-xs font-semibold rounded ${currency === 'USD' ? 'bg-white text-pink-600 shadow' : ''}`}>USD ($)</button>
                    <button onClick={() => setCurrency('VES')} className={`px-2 py-1 text-xs font-semibold rounded ${currency === 'VES' ? 'bg-white text-pink-600 shadow' : ''}`}>Bs. (VES)</button>
                  </div>
                </div>
              </div>
            </header>
          )}

          {isPreview && (
            <div className="bg-slate-900 text-white sticky top-0 z-50 p-3 shadow-xl flex justify-between items-center max-w-7xl mx-auto rounded-b">
              <span className="text-xs text-slate-300">Modo Vista Previa Activado</span>
              <div className="flex space-x-2">
                <button onClick={exportAsPDF} disabled={isExporting} className="px-3 py-1.5 bg-pink-600 hover:bg-pink-700 text-xs font-medium rounded text-white shadow">Descargar PDF</button>
                <button onClick={() => setIsPreview(false)} className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-medium rounded text-slate-200">Volver a Editar</button>
              </div>
            </div>
          )}

          <main className="max-w-7xl mx-auto p-4 md:p-6">
            {!isPreview ? (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* FORMULARIO EDITABLE */}
                <div className="lg:col-span-6 space-y-4 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                  <h2 className="text-sm font-bold text-pink-600 uppercase border-b pb-2">Configuración General</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div>
                      <label className="block font-semibold mb-1">Logo Corporativo</label>
                      <input type="file" accept="image/*" onChange={handleLogoUpload} className="block w-full text-xs text-slate-500 mb-1" />
                      <input type="url" placeholder="O pega URL..." value={logoUrl.startsWith('data:') ? '' : logoUrl} onChange={(e) => setLogoUrl(e.target.value)} className="w-full p-2 border rounded" />
                    </div>
                    <div className="space-y-2">
                      <div>
                        <label className="block font-semibold mb-1">N° Factura / Control</label>
                        <input type="text" value={invoiceNumber} onChange={(e) => setInvoiceNumber(e.target.value)} className="w-full p-2 border rounded font-semibold" />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[10px] font-semibold">Emisión</label>
                          <input type="date" value={invoiceDate} onChange={(e) => setInvoiceDate(e.target.value)} className="w-full p-1 border rounded" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-semibold">Vencimiento</label>
                          <input type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} className="w-full p-1 border rounded" />
                        </div>
                      </div>
                    </div>
                  </div>

                  <h2 className="text-sm font-bold text-pink-600 uppercase border-b pb-2 pt-2">Datos del Cliente</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    <input type="text" placeholder="Nombre / Razón Social" value={clientName} onChange={(e) => setClientName(e.target.value)} className="w-full p-2 border rounded" />
                    <input type="text" placeholder="C.I. / RIF" value={clientDoc} onChange={(e) => setClientDoc(e.target.value)} className="w-full p-2 border rounded" />
                    <input type="text" placeholder="Teléfono" value={clientPhone} onChange={(e) => setClientPhone(e.target.value)} className="w-full p-2 border rounded" />
                    <input type="text" placeholder="Dirección" value={clientAddress} onChange={(e) => setClientAddress(e.target.value)} className="w-full p-2 border rounded" />
                  </div>

                  <div className="flex justify-between items-center border-b pb-1 pt-2">
                    <h2 className="text-sm font-bold text-pink-600 uppercase">Ítems</h2>
                    <button onClick={handleAddItem} className="bg-pink-50 text-pink-700 text-xs px-2 py-1 rounded font-bold border border-pink-200">+ Agregar</button>
                  </div>

                  <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                    {items.map((item) => (
                      <div key={item.id} className="p-3 bg-slate-50 border rounded text-xs space-y-2">
                        <input type="text" placeholder="Producto / Servicio" value={item.title} onChange={(e) => handleItemChange(item.id, 'title', e.target.value)} className="w-full p-1.5 border rounded font-medium" />
                        <input type="text" placeholder="Descripción adicional" value={item.description} onChange={(e) => handleItemChange(item.id, 'description', e.target.value)} className="w-full p-1 border rounded text-[11px]" />
                        <div className="flex gap-2">
                          <input type="number" placeholder="Cant" value={item.quantity} onChange={(e) => handleItemChange(item.id, 'quantity', e.target.value)} className="w-1/2 p-1 border rounded" />
                          <input type="number" placeholder="Precio ($)" value={item.price} onChange={(e) => handleItemChange(item.id, 'price', e.target.value)} className="w-1/2 p-1 border rounded" />
                        </div>
                        {items.length > 1 && (
                          <button onClick={() => handleRemoveItem(item.id)} className="text-red-500 text-[11px]">Eliminar Ítem</button>
                        )}
                      </div>
                    ))}
                  </div>

                  <div className="border-t pt-2 grid grid-cols-2 gap-2 text-xs">
                    <div>
                      <label className="block font-semibold mb-1">Descuento (%)</label>
                      <input type="number" value={discountPercent} onChange={(e) => setDiscountPercent(e.target.value)} className="w-full p-2 border rounded" />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">Datos de Pago / Banco</label>
                      <input type="text" placeholder="Ej: Pago Móvil / Zelle" value={paymentInfo} onChange={(e) => setPaymentInfo(e.target.value)} className="w-full p-2 border rounded" />
                    </div>
                  </div>

                  <button onClick={() => setIsPreview(true)} className="w-full mt-4 bg-pink-600 text-white text-xs font-bold py-2.5 rounded shadow hover:bg-pink-700">
                    Ver Documento / Generar PDF
                  </button>
                </div>

                {/* VISTA PREVIA LATERAL */}
                <div className="lg:col-span-6 bg-slate-200 p-4 rounded-xl flex justify-center items-start overflow-auto">
                  <div ref={invoiceRef} className="bg-white p-8 rounded shadow-lg w-full max-w-md text-xs space-y-4">
                    <div className="flex justify-between items-start border-b pb-3">
                      <div>
                        {logoUrl ? <img src={logoUrl} alt="Logo" className="h-12 object-contain mb-1" /> : <h1 className="text-lg font-bold text-slate-900">ARI FASHION</h1>}
                        <p className="text-[10px] text-pink-600 font-medium uppercase tracking-widest">belleza, moda y estilo</p>
                      </div>
                      <div className="text-right">
                        <h2 className="text-sm font-bold text-slate-800">COTIZACIÓN</h2>
                        <p className="text-xs font-semibold text-pink-600">N° {invoiceNumber}</p>
                        <p className="text-[10px] text-slate-500">Fecha: {invoiceDate}</p>
                      </div>
                    </div>

                    {clientName && (
                      <div className="bg-slate-50 p-2.5 rounded text-[11px] space-y-0.5 border border-slate-100">
                        <p><strong>Cliente:</strong> {clientName}</p>
                        {clientDoc && <p><strong>RIF/C.I.:</strong> {clientDoc}</p>}
                        {clientPhone && <p><strong>Teléfono:</strong> {clientPhone}</p>}
                        {clientAddress && <p><strong>Dirección:</strong> {clientAddress}</p>}
                      </div>
                    )}

                    <table className="w-full text-left text-[11px]">
                      <thead>
                        <tr className="border-b border-slate-200 text-slate-500">
                          <th className="py-1">Descripción</th>
                          <th className="py-1 text-center">Cant</th>
                          <th className="py-1 text-right">Total</th>
                        </tr>
                      </thead>
                      <tbody>
                        {items.map((it) => (
                          <tr key={it.id} className="border-b border-slate-100">
                            <td className="py-1.5">
                              <p className="font-semibold">{it.title || 'Ítem'}</p>
                              {it.description && <p className="text-[9px] text-slate-400">{it.description}</p>}
                            </td>
                            <td className="py-1.5 text-center">{it.quantity}</td>
                            <td className="py-1.5 text-right">{renderMoney(it.quantity * it.price, it.quantity * it.price * rate)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>

                    <div className="flex justify-end pt-2">
                      <div className="w-1/2 text-right space-y-1">
                        <div className="flex justify-between text-[11px]"><span>Subtotal:</span> {renderMoney(subtotalUSD, subtotalVES)}</div>
                        {discountPercent > 0 && <div className="flex justify-between text-[11px] text-red-600"><span>Desc. ({discountPercent}%):</span> -{renderMoney(discountUSD, discountVES)}</div>}
                        <div className="flex justify-between font-bold text-xs border-t pt-1"><span>TOTAL:</span> {renderMoney(totalUSD, totalVES)}</div>
                      </div>
                    </div>

                    {paymentInfo && (
                      <div className="border-t pt-2 text-[10px] text-slate-600">
                        <p className="font-bold text-slate-800">Métodos de Pago:</p>
                        <p>{paymentInfo}</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ) : (
              /* MODO COMPLETO VISTA PREVIA */
              <div className="flex justify-center py-4">
                <div ref={invoiceRef} className="bg-white p-10 rounded-xl shadow-2xl w-full max-w-xl text-xs space-y-6">
                  <div className="flex justify-between items-start border-b pb-4">
                    <div>
                      {logoUrl ? <img src={logoUrl} alt="Logo" className="h-16 object-contain mb-2" /> : <h1 className="text-2xl font-bold text-slate-900 font-serif">ARI FASHION</h1>}
                      <p className="text-xs text-pink-600 font-medium uppercase tracking-widest">belleza, moda y estilo</p>
                    </div>
                    <div className="text-right">
                      <h2 className="text-lg font-bold text-slate-800">COTIZACIÓN / FACTURA</h2>
                      <p className="text-sm font-semibold text-pink-600">N° {invoiceNumber}</p>
                      <p className="text-xs text-slate-500">Fecha: {invoiceDate}</p>
                      {dueDate && <p className="text-xs text-slate-500">Vencimiento: {dueDate}</p>}
                    </div>
                  </div>

                  {clientName && (
                    <div className="bg-slate-50 p-4 rounded-lg text-xs space-y-1 border border-slate-100">
                      <p><strong>Cliente:</strong> {clientName}</p>
                      {clientDoc && <p><strong>RIF/C.I.:</strong> {clientDoc}</p>}
                      {clientPhone && <p><strong>Teléfono:</strong> {clientPhone}</p>}
                      {clientAddress && <p><strong>Dirección:</strong> {clientAddress}</p>}
                    </div>
                  )}

                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="border-b-2 border-slate-200 text-slate-600">
                        <th className="py-2">Descripción</th>
                        <th className="py-2 text-center">Cant</th>
                        <th className="py-2 text-right">Precio U.</th>
                        <th className="py-2 text-right">Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {items.map((it) => (
                        <tr key={it.id} className="border-b border-slate-100">
                          <td className="py-2">
                            <p className="font-bold">{it.title || 'Sin título'}</p>
                            {it.description && <p className="text-slate-500 text-[10px]">{it.description}</p>}
                          </td>
                          <td className="py-2 text-center">{it.quantity}</td>
                          <td className="py-2 text-right">{renderMoney(it.price, it.price * rate)}</td>
                          <td className="py-2 text-right">{renderMoney(it.quantity * it.price, it.quanti
