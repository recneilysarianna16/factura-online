<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARI FASHION - Cotizaciones</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #334155; margin: 0; padding: 0; }
    .header { background: #ffffff; padding: 16px; border-bottom: 2px solid #fbcfe8; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .title { font-size: 20px; font-weight: bold; color: #0f172a; margin: 0; }
    .subtitle { font-size: 11px; color: #db2777; text-transform: uppercase; letter-spacing: 1px; }
    .top-controls { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .input-sm { padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 4px; width: 80px; text-align: right; }
    .btn-toggle { padding: 4px 10px; font-size: 12px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; border-radius: 4px; }
    .btn-toggle.active { background: #db2777; color: white; border-color: #db2777; }
    
    .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 900px) { .container { grid-template-columns: 1fr 1fr; } }
    
    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .section-title { font-size: 13px; font-weight: bold; color: #db2777; text-transform: uppercase; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .input-text { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .item-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .btn-add { background: #fdf2f8; color: #db2777; border: 1px solid #fbcfe8; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-main { background: #db2777; color: white; width: 100%; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn-main:hover { background: #be185d; }
    
    /* Documento Factura */
    .invoice { background: white; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 12px; }
    .inv-header { display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 12px; }
    .inv-table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .inv-table th, .inv-table td { padding: 8px; text-align: left; border-bottom: 1px solid #f1f5f9; }
    .inv-table th { color: #64748b; font-size: 11px; border-bottom: 2px solid #e2e8f0; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    
    @media print {
      body * { visibility: hidden; }
      #invoice-document, #invoice-document * { visibility: visible; }
      #invoice-document { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <header class="header no-print">
    <div>
      <h1 class="title">ARI FASHION</h1>
      <span class="subtitle">belleza, moda y estilo</span>
    </div>
    <div class="top-controls">
      <span>Tasa BCV: Bs.</span>
      <input type="number" step="0.01" id="exchangeRate" class="input-sm" value="56.50" oninput="updateState('exchangeRate', this.value)" />
      <div>
        <button id="btn-usd" class="btn-toggle active" onclick="setCurrency('USD')">USD ($)</button>
        <button id="btn-ves" class="btn-toggle" onclick="setCurrency('VES')">Bs. (VES)</button>
      </div>
    </div>
  </header>

  <div class="container no-print">
    <!-- FORMULARIO -->
    <div class="card">
      <div class="section-title">Datos Generales</div>
      <div class="grid-2">
        <div class="form-group">
          <label>N° Cotización</label>
          <input type="text" id="invoiceNumber" class="input-text" value="0001" oninput="updateState('invoiceNumber', this.value)" />
        </div>
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="invoiceDate" class="input-text" onchange="updateState('invoiceDate', this.value)" />
        </div>
      </div>

      <div class="section-title" style="margin-top: 15px;">Datos del Cliente</div>
      <div class="grid-2">
        <div class="form-group"><input type="text" placeholder="Nombre / Razón Social" class="input-text" oninput="updateState('clientName', this.value)" /></div>
        <div class="form-group"><input type="text" placeholder="RIF / C.I." class="input-text" oninput="updateState('clientDoc', this.value)" /></div>
        <div class="form-group"><input type="text" placeholder="Teléfono" class="input-text" oninput="updateState('clientPhone', this.value)" /></div>
        <div class="form-group"><input type="text" placeholder="Dirección" class="input-text" oninput="updateState('clientAddress', this.value)" /></div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
        <div class="section-title" style="margin: 0;">Ítems</div>
        <button class="btn-add" onclick="addItem()">+ Agregar Ítem</button>
      </div>
      <div id="items-list" style="margin-top: 10px;"></div>

      <div class="grid-2" style="margin-top: 10px;">
        <div class="form-group">
          <label>Descuento (%)</label>
          <input type="number" class="input-text" value="0" oninput="updateState('discountPercent', this.value)" />
        </div>
        <div class="form-group">
          <label>Datos de Pago</label>
          <input type="text" placeholder="Ej: Pago Móvil / Banco" class="input-text" oninput="updateState('paymentInfo', this.value)" />
        </div>
      </div>

      <button class="btn-main" onclick="window.print()">Imprimir / Guardar en PDF</button>
    </div>

    <!-- VISTA PREVIA -->
    <div>
      <div id="invoice-document" class="invoice"></div>
    </div>
  </div>

  <script>
    const state = {
      currency: 'USD',
      exchangeRate: 56.50,
      invoiceNumber: '0001',
      invoiceDate: new Date().toISOString().split('T')[0],
      clientName: '',
      clientDoc: '',
      clientPhone: '',
      clientAddress: '',
      items: [{ id: 1, title: '', description: '', quantity: 1, price: 0 }],
      discountPercent: 0,
      paymentInfo: ''
    };

    document.getElementById('invoiceDate').value = state.invoiceDate;

    function formatMoney(usd, ves) {
      const u = `$ ${Number(usd || 0).toFixed(2)}`;
      const v = `Bs. ${Number(ves || 0).toFixed(2)}`;
      if (state.currency === 'USD') {
        return `<strong>${u}</strong><br><span style="color:#64748b; font-size:10px;">Eqv: ${v}</span>`;
      } else {
        return `<strong>${v}</strong><br><span style="color:#64748b; font-size:10px;">Eqv: ${u}</span>`;
      }
    }

    function renderItemsForm() {
      const container = document.getElementById('items-list');
      container.innerHTML = state.items.map((item, index) => `
        <div class="item-box">
          <input type="text" placeholder="Producto o Servicio" class="input-text" style="margin-bottom: 4px;" value="${item.title}" oninput="updateItem(${index}, 'title', this.value)" />
          <input type="text" placeholder="Descripción breve" class="input-text" style="margin-bottom: 6px; font-size: 11px;" value="${item.description}" oninput="updateItem(${index}, 'description', this.value)" />
          <div class="grid-2">
            <input type="number" placeholder="Cant" class="input-text" value="${item.quantity}" oninput="updateItem(${index}, 'quantity', this.value)" />
            <input type="number" placeholder="Precio ($)" class="input-text" value="${item.price}" oninput="updateItem(${index}, 'price', this.value)" />
          </div>
          ${state.items.length > 1 ? `<div style="text-align:right; margin-top:4px;"><a href="#" onclick="removeItem(${index})" style="color:#ef4444; font-size:11px; text-decoration:none;">Eliminar</a></div>` : ''}
        </div>
      `).join('');
    }

    function renderPreview() {
      const doc = document.getElementById('invoice-document');
      const rate = Number(state.exchangeRate) || 1;
      
      const subtotalUSD = state.items.reduce((s, i) => s + (Number(i.quantity) * Number(i.price) || 0), 0);
      const discountUSD = (subtotalUSD * (Number(state.discountPercent) || 0)) / 100;
      const totalUSD = subtotalUSD - discountUSD;

      doc.innerHTML = `
        <div class="inv-header">
          <div>
            <h1 style="margin:0; font-size:18px; color:#0f172a;">ARI FASHION</h1>
            <div style="color:#db2777; font-size:10px; font-weight:bold; letter-spacing:1px;">BELLEZA, MODA Y ESTILO</div>
          </div>
          <div class="text-right">
            <h3 style="margin:0; font-size:14px;">COTIZACIÓN</h3>
            <div style="color:#db2777; font-weight:bold;">N° ${state.invoiceNumber}</div>
            <div style="color:#64748b; font-size:10px;">Fecha: ${state.invoiceDate}</div>
          </div>
        </div>

        ${state.clientName ? `
          <div style="background:#f8fafc; padding:10px; border-radius:4px; margin-bottom:12px; font-size:11px;">
            <div><strong>Cliente:</strong> ${state.clientName}</div>
            ${state.clientDoc ? `<div><strong>RIF/C.I.:</strong> ${state.clientDoc}</div>` : ''}
            ${state.clientPhone ? `<div><strong>Teléfono:</strong> ${state.clientPhone}</div>` : ''}
            ${state.clientAddress ? `<div><strong>Dirección:</strong> ${state.clientAddress}</div>` : ''}
          </div>
        ` : ''}

        <table class="inv-table">
          <thead>
            <tr>
              <th>Descripción</th>
              <th class="text-center">Cant</th>
              <th class="text-right">Total</th>
            </tr>
          </thead>
          <tbody>
            ${state.items.map(it => {
              const rowTotUSD = Number(it.quantity) * Number(it.price) || 0;
              return `
                <tr>
                  <td>
                    <strong>${it.title || 'Ítem'}</strong>
                    ${it.description ? `<br><span style="color:#64748b; font-size:10px;">${it.description}</span>` : ''}
                  </td>
                  <td class="text-center">${it.quantity}</td>
                  <td class="text-right">${formatMoney(rowTotUSD, rowTotUSD * rate)}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>

        <div style="display:flex; justify-content:flex-end; margin-top:15px;">
          <div style="width:200px;" class="text-right">
            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
              <span>Subtotal:</span>
              <span>${formatMoney(subtotalUSD, subtotalUSD * rate)}</span>
            </div>
            ${state.discountPercent > 0 ? `
              <div style="display:flex; justify-content:space-between; color:#ef4444; margin-bottom:4px;">
                <span>Desc (${state.discountPercent}%):</span>
                <span>-${formatMoney(discountUSD, discountUSD * rate)}</span>
              </div>
            ` : ''}
            <div style="display:flex; justify-content:space-between; font-weight:bold; border-top:1px solid #cbd5e1; padding-top:4px; font-size:13px;">
              <span>TOTAL:</span>
              <span>${formatMoney(totalUSD, totalUSD * rate)}</span>
            </div>
          </div>
        </div>

        ${state.paymentInfo ? `
          <div style="margin-top:20px; border-top:1px solid #e2e8f0; padding-top:10px; font-size:10px; color:#475569;">
            <strong>Métodos de Pago:</strong><br>${state.paymentInfo}
          </div>
        ` : ''}
      `;
    }

    function updateState(key, val) {
      state[key] = val;
      renderPreview();
    }

    function updateItem(idx, key, val) {
      state.items[idx][key] = val;
      renderPreview();
    }

    function addItem() {
      state.items.push({ id: Date.now(), title: '', description: '', quantity: 1, price: 0 });
      renderItemsForm();
      renderPreview();
    }

    function removeItem(idx) {
      state.items.splice(idx, 1);
      renderItemsForm();
      renderPreview();
    }

    function setCurrency(curr) {
      state.currency = curr;
      document.getElementById('btn-usd').className = `btn-toggle ${curr === 'USD' ? 'active' : ''}`;
      document.getElementById('btn-ves').className = `btn-toggle ${curr === 'VES' ? 'active' : ''}`;
      renderPreview();
    }

    // Inicializar
    renderItemsForm();
    renderPreview();
  </script>
</body>
</html>
