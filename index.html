/* =========================================================================
   ARI FASHION - GENERADOR DE FACTURAS
   Vanilla JS (sin React/Babel) para carga rápida en GitHub Pages.
   ========================================================================= */

/* ---------- Utilidades de almacenamiento local ---------- */
const STORE_SETTINGS = 'ariFashion_settings_v2';
const STORE_INVOICES = 'ariFashion_invoices_v2';

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORE_SETTINGS);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.warn('No se pudo leer configuración guardada', e); }
  return {};
}
function saveSettings(partial) {
  const current = loadSettings();
  const merged = { ...current, ...partial };
  try { localStorage.setItem(STORE_SETTINGS, JSON.stringify(merged)); } catch (e) { console.warn('No se pudo guardar configuración', e); }
  return merged;
}
function loadInvoices() {
  try {
    const raw = localStorage.getItem(STORE_INVOICES);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.warn('No se pudo leer historial', e); }
  return [];
}
function saveInvoices(list) {
  try { localStorage.setItem(STORE_INVOICES, JSON.stringify(list)); } catch (e) { console.warn('No se pudo guardar historial', e); }
}

/* ---------- Estado ---------- */
const savedSettings = loadSettings();

const state = {
  view: 'editor', // 'editor' | 'preview' | 'historial'
  isDarkMode: savedSettings.isDarkMode !== undefined ? savedSettings.isDarkMode : true,
  currency: savedSettings.currency || 'USD',
  exchangeRate: savedSettings.exchangeRate || 56.50,
  template: savedSettings.template || 'elegante',
  logoUrl: savedSettings.logoUrl || '',

  invoiceNumber: nextInvoiceNumber(savedSettings.lastInvoiceNumber || 0),
  invoiceDate: new Date().toISOString().split('T')[0],
  dueDate: '',

  client: { name: '', doc: '', phone: '', address: '' },

  items: [{ id: 1, title: '', description: '', quantity: 1, price: 0 }],

  discountPercent: 0,
  notes: '',
  paymentInfo: savedSettings.paymentInfo || '',

  errors: [],
  isExporting: false,
  exportMessage: '',
  historyPreviewId: null // si se está viendo una factura del historial
};

function nextInvoiceNumber(lastNumber) {
  const n = (Number(lastNumber) || 0) + 1;
  return String(n).padStart(4, '0');
}

/* ---------- Íconos (SVG como strings) ---------- */

/* ---------- Cálculos ---------- */
function calcTotals() {
  const subtotalUSD = state.items.reduce((sum, it) => sum + ((Number(it.quantity) || 0) * (Number(it.price) || 0)), 0);
  const discountUSD = (subtotalUSD * (Number(state.discountPercent) || 0)) / 100;
  const totalUSD = subtotalUSD - discountUSD;
  const rate = Number(state.exchangeRate) || 1;
  return {
    subtotalUSD, discountUSD, totalUSD,
    subtotalVES: subtotalUSD * rate,
    discountVES: discountUSD * rate,
    totalVES: totalUSD * rate
  };
}
function formatUSD(val) { return `$ ${Number(val || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
function formatVES(val) { return `Bs. ${Number(val || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
function renderMoneyHTML(amountUSD, amountVES) {
  const dim = state.isDarkMode ? 'text-slate-400' : 'text-slate-500';
  if (state.currency === 'USD') {
    return `<div><span class="font-bold">${formatUSD(amountUSD)}</span><div class="text-[10px] font-normal ${dim}">Eqv: ${formatVES(amountVES)}</div></div>`;
  }
  return `<div><span class="font-bold">${formatVES(amountVES)}</span><div class="text-[10px] font-normal ${dim}">Eqv: ${formatUSD(amountUSD)}</div></div>`;
}

/* ---------- Validación ---------- */
function validate() {
  const errors = [];
  if (!state.client.name.trim()) errors.push('Falta el nombre del cliente.');
  const validItems = state.items.filter(it => it.title.trim() !== '' || Number(it.quantity) > 0 || Number(it.price) > 0);
  if (validItems.length === 0) errors.push('Agrega al menos un producto o servicio.');
  state.items.forEach((it, idx) => {
    if (it.title.trim() === '' && (Number(it.quantity) > 0 || Number(it.price) > 0)) {
      errors.push(`El producto #${idx + 1} necesita un nombre.`);
    }
    if (it.title.trim() !== '' && (!(Number(it.quantity) > 0))) {
      errors.push(`La cantidad del producto "${it.title}" debe ser mayor a 0.`);
    }
    if (Number(it.price) < 0) {
      errors.push(`El precio de "${it.title || 'un producto'}" no puede ser negativo.`);
    }
  });
  if (Number(state.discountPercent) < 0 || Number(state.discountPercent) > 100) {
    errors.push('El descuento debe estar entre 0% y 100%.');
  }
  if (!(Number(state.exchangeRate) > 0)) {
    errors.push('La tasa de cambio debe ser mayor a 0.');
  }
  state.errors = errors;
  return errors.length === 0;
}

/* ---------- Historial ---------- */
function persistCurrentInvoiceToHistory() {
  const totals = calcTotals();
  const invoices = loadInvoices();
  const snapshot = {
    id: Date.now(),
    number: state.invoiceNumber,
    date: state.invoiceDate,
    clientName: state.client.name,
    totalUSD: totals.totalUSD,
    totalVES: totals.totalVES,
    currency: state.currency,
    data: JSON.parse(JSON.stringify(state)) // copia completa para poder reabrirla
  };
  invoices.unshift(snapshot);
  saveInvoices(invoices);
  saveSettings({ lastInvoiceNumber: Number(state.invoiceNumber) });
}

function loadInvoiceFromHistory(id) {
  const invoices = loadInvoices();
  const found = invoices.find(inv => inv.id === id);
  if (!found) return;
  Object.assign(state, JSON.parse(JSON.stringify(found.data)));
  state.view = 'preview';
  state.historyPreviewId = id;
  render();
}

function deleteInvoiceFromHistory(id) {
  if (!confirm('¿Eliminar esta factura del historial? Esta acción no se puede deshacer.')) return;
  const invoices = loadInvoices().filter(inv => inv.id !== id);
  saveInvoices(invoices);
  render();
}

/* ---------- Exportación ---------- */
async function prepareCanvasExport() {
  const el = document.getElementById('invoice-print-area');
  if (!el) return null;
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  const scale = isMobile ? 2 : 2.5;
  return await window.html2canvas(el, {
    scale, useCORS: true, allowTaint: true,
    backgroundColor: state.isDarkMode ? '#090d16' : '#ffffff', logging: false
  });
}

async function exportAsImage() {
  state.isExporting = true; state.exportMessage = 'Generando imagen...'; render();
  try {
    const canvas = await prepareCanvasExport();
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = `Factura_Ari_Fashion_${state.invoiceNumber || 'SN'}.png`;
    link.href = canvas.toDataURL('image/png', 1.0);
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    if (state.historyPreviewId === null) persistCurrentInvoiceToHistory();
  } catch (err) { console.error('Error al exportar imagen:', err); alert('Ocurrió un error generando la imagen.'); }
  finally { state.isExporting = false; state.exportMessage = ''; render(); }
}

async function exportAsPDF() {
  state.isExporting = true; state.exportMessage = 'Generando PDF...'; render();
  try {
    const canvas = await prepareCanvasExport();
    if (!canvas) return;
    const imgData = canvas.toDataURL('image/png');
    const jsPDFClass = window.jspdf ? window.jspdf.jsPDF : window.jsPDF;
    const pdf = new jsPDFClass('p', 'mm', 'a4');
    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = pdf.internal.pageSize.getHeight();
    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    pdf.save(`Factura_Ari_Fashion_${state.invoiceNumber || 'SN'}.pdf`);
    if (state.historyPreviewId === null) persistCurrentInvoiceToHistory();
  } catch (err) { console.error('Error al exportar PDF:', err); alert('Ocurrió un error generando el PDF.'); }
  finally { state.isExporting = false; state.exportMessage = ''; render(); }
}

function shareOnWhatsApp() {
  const totals = calcTotals();
  const total = state.currency === 'USD' ? formatUSD(totals.totalUSD) : formatVES(totals.totalVES);
  const lines = [
    `*Ari Fashion* - Factura N° ${state.invoiceNumber}`,
    `Cliente: ${state.client.name}`,
    `Fecha: ${state.invoiceDate}`,
    `Total: ${total}`,
    '',
    'Gracias por tu compra ✨'
  ];
  const url = `https://wa.me/?text=${encodeURIComponent(lines.join('\n'))}`;
  window.open(url, '_blank');
}

/* ---------- Manejo de items ---------- */
function addItem() {
  state.items.push({ id: Date.now(), title: '', description: '', quantity: 1, price: 0 });
  render();
}
function removeItem(id) {
  if (state.items.length === 1) return;
  state.items = state.items.filter(it => it.id !== id);
  render();
}
function updateItem(id, field, value) {
  const item = state.items.find(it => it.id === id);
  if (item) item[field] = value;
}

/* ---------- Logo ---------- */
function handleLogoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onloadend = () => {
    state.logoUrl = reader.result;
    saveSettings({ logoUrl: state.logoUrl });
    render();
  };
  reader.readAsDataURL(file);
}

/* ---------- Nueva factura ---------- */
function startNewInvoice() {
  const settings = loadSettings();
  state.view = 'editor';
  state.historyPreviewId = null;
  state.invoiceNumber = nextInvoiceNumber(settings.lastInvoiceNumber || 0);
  state.invoiceDate = new Date().toISOString().split('T')[0];
  state.dueDate = '';
  state.client = { name: '', doc: '', phone: '', address: '' };
  state.items = [{ id: 1, title: '', description: '', quantity: 1, price: 0 }];
  state.discountPercent = 0;
  state.notes = '';
  state.errors = [];
  render();
}

/* ---------- Vistas ---------- */
function goToPreview() {
  if (!validate()) { render(); return; }
  state.view = 'preview';
  render();
}

/* =========================================================================
   RENDER
   ========================================================================= */
function render() {
  const app = document.getElementById('app');
  app.className = `min-h-screen flex flex-col transition-colors duration-300 ${state.isDarkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-100 text-slate-800'}`;
  app.innerHTML = renderHeader() + renderBody();
  attachGlobalEvents();
  if (state.view === 'editor') attachEditorEvents();
  if (state.view === 'historial') attachHistoryEvents();
  if (state.view === 'preview') attachPreviewEvents();
}

        <div class="flex items-center space-x-1.5 text-xs text-slate-300">
          ${ICONS.checkCircle.replace('w-4 h-4','w-4 h-4 text-pink-400 shrink-0')}

        </div>
        <div class="flex items-center space-x-1.5 sm:space-x-2 flex-wrap">

  return `
  <header class="no-print border-b shadow-lg sticky top-0 z-30 transition-colors duration-300 ${state.isD
