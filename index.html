<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Fashion - Sistema de Facturación Profesional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX en navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @media print {
        body * {
          visibility: hidden;
        }
        .print-area, .print-area * {
          visibility: visible;
        }
        .print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 20px;
          box-shadow: none !important;
          border: none !important;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-pink-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Componentes de Iconos SVG
    const IconUser = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>);
    const IconFileText = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>);
    const IconPlus = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>);
    const IconTrash = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>);
    const IconCreditCard = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>);
    const IconEye = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>);
    const IconHistory = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>);
    const IconSettings = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>);
    const IconCheck = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>);

    function App() {
      const [activeTab, setActiveTab] = useState('editor');
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [templateStyle, setTemplateStyle] = useState('modern');
      const [logoUrl, setLogoUrl] = useState('');
      const [exchangeRate, setExchangeRate] = useState(() => Number(localStorage.getItem('ari_exchange_rate')) || 36.50);
      const [currency, setCurrency] = useState('USD');

      const [invoiceNumber, setInvoiceNumber] = useState(() => {
        const lastNum = localStorage.getItem('ari_last_invoice_seq');
        const next = lastNum ? parseInt(lastNum, 10) + 1 : 1;
        return `FAC-${String(next).padStart(4, '0')}`;
      });
      const [invoiceDate, setInvoiceDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [dueDate, setDueDate] = useState('');

      const [clientName, setClientName] = useState('');
      const [clientDoc, setClientDoc] = useState('');
      const [clientPhone, setClientPhone] = useState('');
      const [clientAddress, setClientAddress] = useState('');

      const [items, setItems] = useState([
        { id: 1, title: '', description: '', quantity: 1, price: 0 }
      ]);
      const [discountPercent, setDiscountPercent] = useState(0);

      const [paymentInfo, setPaymentInfo] = useState('Pago Móvil / Transferencia Banesco o Mercantil\nZelle: pagos@arifashion.com');
      const [notes, notesSet] = useState('Gracias por tu compra. Cambios válidos únicamente dentro de los 7 días con etiqueta intacta.');

      const [invoiceHistory, setInvoiceHistory] = useState(() => {
        const saved = localStorage.getItem('ari_invoice_history');
        return saved ? JSON.parse(saved) : [];
      });

      const [errors, setErrors] = useState({});

      useEffect(() => {
        localStorage.setItem('ari_invoice_history', JSON.stringify(invoiceHistory));
      }, [invoiceHistory]);

      useEffect(() => {
        localStorage.setItem('ari_exchange_rate', exchangeRate);
      }, [exchangeRate]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setLogoUrl(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddItem = () => {
        setItems([...items, { id: Date.now(), title: '', description: '', quantity: 1, price: 0 }]);
      };

      const handleRemoveItem = (id) => {
        if (items.length > 1) {
          setItems(items.filter(item => item.id !== id));
        }
      };

      const handleItemChange = (id, field, value) => {
        setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
      };

      const subtotalUSD = useMemo(() => {
        return items.reduce((acc, item) => acc + ((Number(item.quantity) || 0) * (Number(item.price) || 0)), 0);
      }, [items]);

      const discountUSD = useMemo(() => {
        const disc = Number(discountPercent) || 0;
        return (subtotalUSD * disc) / 100;
      }, [subtotalUSD, discountPercent]);

      const totalUSD = useMemo(() => Math.max(0, subtotalUSD - discountUSD), [subtotalUSD, discountUSD]);

      const subtotalVES = subtotalUSD * exchangeRate;
      const discountVES = discountUSD * exchangeRate;
      const totalVES = totalUSD * exchangeRate;

      const renderMoney = (usd, ves) => {
        if (currency === 'USD') {
          return (
            <div className="text-right">
              <span className="font-bold">$ {usd.toFixed(2)}</span>
              <span className="block text-[10px] text-slate-400">Bs. {ves.toFixed(2)}</span>
            </div>
          );
        } else {
          return (
            <div className="text-right">
              <span className="font-bold">Bs. {ves.toFixed(2)}</span>
              <span className="block text-[10px] text-slate-400">$ {usd.toFixed(2)}</span>
            </div>
          );
        }
      };

      const validateForm = () => {
        const newErrors = {};
        if (!invoiceNumber.trim()) newErrors.invoiceNumber = 'El número de factura es obligatorio.';
        if (!clientName.trim()) newErrors.clientName = 'El nombre del cliente es obligatorio.';
        if (items.some(item => !item.title.trim())) newErrors.items = 'Todos los ítems deben tener título.';
        
        setErrors(newErrors);
        return Object.keys(newErrors).length === 0;
      };

      const handleSaveAndEmit = () => {
        if (!validateForm()) {
          alert('Por favor completa los campos obligatorios marcados en rojo.');
          return;
        }

        const newInvoice = {
          id: Date.now(),
          invoiceNumber,
          invoiceDate,
          dueDate,
          clientName,
          clientDoc,
          clientPhone,
          clientAddress,
          items,
          discountPercent,
          totalUSD,
          totalVES,
          exchangeRate,
          paymentInfo,
          notes,
          templateStyle,
          logoUrl
        };

        setInvoiceHistory([newInvoice, ...invoiceHistory]);

        const numericPart = invoiceNumber.replace(/[^0-9]/g, '');
        if (numericPart) {
          const nextSeq = parseInt(numericPart, 10) + 1;
          const prefix = invoiceNumber.replace(/[0-9]/g, '');
          const nextInvNum = `${prefix || 'FAC-'}${String(nextSeq).padStart(4, '0')}`;
          setInvoiceNumber(nextInvNum);
          localStorage.setItem('ari_last_invoice_seq', nextSeq);
        }

        alert(`¡Factura ${invoiceNumber} emitida y guardada con éxito en el historial!`);
        window.print();
      };

      return (
        <div className={`min-h-screen transition-colors duration-300 ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
          <header className={`no-print sticky top-0 z-50 border-b backdrop-blur-md px-4 py-3 shadow-sm ${isDarkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white font-black shadow-lg shadow-pink-500/30">
                  A
                </div>
                <div>
                  <h1 className="text-base font-black tracking-wider bg-gradient-to-r from-pink-500 to-rose-400 bg-clip-text text-transparent">
                    ARI FASHION <span className="text-xs font-normal text-slate-400">| Facturación</span>
                  </h1>
                  <p className="text-[10px] text-slate-400">Sistema Profesional para Emprendimientos</p>
                </div>
              </div>

              <div className="flex items-center gap-2 flex-wrap justify-center">
                <button
                  onClick={() => setActiveTab('editor')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 ${
                    activeTab === 'editor' 
                      ? 'bg-pink-500 text-white shadow-md shadow-pink-500/20' 
                      : isDarkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}
                >
                  <IconFileText />
                  <span>Nueva Factura</span>
                </button>

                <button
                  onClick={() => setActiveTab('history')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 ${
                    activeTab === 'history' 
                      ? 'bg-pink-500 text-white shadow-md shadow-pink-500/20' 
                      : isDarkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}
                >
                  <IconHistory />
                  <span>Historial ({invoiceHistory.length})</span>
                </button>

                <div className={`h-6 w-[1px] mx-1 ${isDarkMode ? 'bg-slate-800' : 'bg-slate-200'}`} />

                <div className="flex items-center space-x-2 text-xs">
                  <span className="text-slate-400 font-semibold">Tasa Bs/$:</span>
                  <input
                    type="number"
                    step="0.01"
                    value={exchangeRate}
                    onChange={(e) => setExchangeRate(Number(e.target.value))}
                    className={`w-20 px-2 py-1 rounded-lg text-center font-bold border outline-none ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-slate-100 border-slate-300 text-slate-800'}`}
                  />
                </div>

                <select
                  value={currency}
                  onChange={(e) => setCurrency(e.target.value)}
                  className={`text-xs px-2.5 py-1 rounded-lg font-bold border outline-none ${isDarkMode ? 'bg-slate-900 border-slate-700 text-pink-400' : 'bg-slate-100 border-slate-300 text-pink-600'}`}
                >
                  <option value="USD">Moneda: USD ($)</option>
                  <option value="VES">Moneda: VES (Bs)</option>
                </select>

                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className={`p-2 rounded-lg border transition ${isDarkMode ? 'bg-slate-800 border-slate-700 text-yellow-400 hover:bg-slate-700' : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'}`}
                  title="Cambiar Tema"
                >
                  {isDarkMode ? '☀️' : '🌙'}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto p-4 sm:p-6">
            {activeTab === 'history' ? (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-black tracking-wide flex items-center space-x-2">
                    <IconHistory className="text-pink-500" />
                    <span>Historial de Facturas Emitidas</span>
                  </h2>
                  <span className="text-xs text-slate-400">Total guardadas: {invoiceHistory.length}</span>
                </div>

                {invoiceHistory.length === 0 ? (
                  <div className={`p-12 text-center rounded-2xl border ${isDarkMode ? 'bg-slate-900/50 border-slate-800 text-slate-400' : 'bg-white border-slate-200 text-slate-500'}`}>
                    <p className="text-sm font-semibold">No hay facturas emitidas todavía.</p>
                    <p className="text-xs mt-1">Crea tu primera factura en la pestaña "Nueva Factura".</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {invoiceHistory.map((inv) => (
                      <div key={inv.id} className={`p-5 rounded-2xl border shadow-sm transition space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-pink-500/10 text-pink-500 border border-pink-500/20">
                              {inv.invoiceNumber}
                            </span>
                            <p className={`text-sm font-bold mt-2 ${isDarkMode ? 'text-white' : 'text-slate-900'}`}>
                              {inv.clientName}
                            </p>
                          </div>
                          <div className="text-right">
                            <span className="text-xs font-black text-pink-500">$ {inv.totalUSD.toFixed(2)}</span>
                            <span className="block text-[10px] text-slate-400">Bs. {inv.totalVES.toFixed(2)}</span>
                          </div>
                        </div>

                        <div className={`text-xs space-y-1 pt-2 border-t ${isDarkMode ? 'border-slate-800 text-slate-400' : 'border-slate-100 text-slate-500'}`}>
                          <p><strong>Fecha:</strong> {inv.invoiceDate}</p>
                          <p><strong>C.I / RIF:</strong> {inv.clientDoc || 'N/A'}</p>
                          <p><strong>Ítems:</strong> {inv.items.length} producto(s)</p>
                          <p><strong>Estilo:</strong> <span className="uppercase text-[10px] font-bold text-pink-400">{inv.templateStyle}</span></p>
                        </div>

                        <div className="pt-2 flex items-center justify-end gap-2">
                          <button
                            onClick={() => {
                              setInvoiceNumber(inv.invoiceNumber);
                              setInvoiceDate(inv.invoiceDate);
                              setDueDate(inv.dueDate || '');
                              setClientName(inv.clientName);
                              setClientDoc(inv.clientDoc);
                              setClientPhone(inv.clientPhone);
                              setClientAddress(inv.clientAddress);
                              setItems(inv.items);
                              setDiscountPercent(inv.discountPercent);
                              setPaymentInfo(inv.paymentInfo);
                              notesSet(inv.notes);
                              setTemplateStyle(inv.templateStyle || 'modern');
                              setLogoUrl(inv.logoUrl || '');
                              setActiveTab('editor');
                            }}
                            className="px-3 py-1.5 rounded-lg bg-pink-500/10 hover:bg-pink-500/20 text-pink-500 font-bold text-xs transition"
                          >
                            Cargar en Editor
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <div className="lg:col-span-6 space-y-5">
                  <div className={`p-4 rounded-2xl border shadow-sm space-y-3 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <h2 className="text-xs font-bold uppercase tracking-wider text-pink-500 flex items-center space-x-1.5">
                      <IconSettings />
                      <span>Diseño de Plantilla & Estética</span>
                    </h2>
                    <div className="grid grid-cols-3 gap-2">
                      <button
                        onClick={() => setTemplateStyle('modern')}
                        className={`p-2.5 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 ${
                          templateStyle === 'modern' 
                            ? 'border-pink-500 bg-pink-500/10 text-pink-400' 
                            : isDarkMode ? 'border-slate-800 bg-slate-950 text-slate-400' : 'border-slate-200 bg-slate-50 text-slate-600'
                        }`}
                      >
                        <span>✨ Moderna Rosa</span>
                      </button>
                      <button
                        onClick={() => setTemplateStyle('minimal')}
                        className={`p-2.5 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 ${
                          templateStyle === 'minimal' 
                            ? 'border-pink-500 bg-pink-500/10 text-pink-400' 
                            : isDarkMode ? 'border-slate-800 bg-slate-950 text-slate-400' : 'border-slate-200 bg-slate-50 text-slate-600'
                        }`}
                      >
                        <span>📌 Minimalista</span>
                      </button>
                      <button
                        onClick={() => setTemplateStyle('darkacademia')}
                        className={`p-2.5 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 ${
                          templateStyle === 'darkacademia' 
                            ? 'border-pink-500 bg-pink-500/10 text-pink-400' 
                            : isDarkMode ? 'border-slate-800 bg-slate-950 text-slate-400' : 'border-slate-200 bg-slate-50 text-slate-600'
                        }`}
                      >
                        <span>🏛️ Dark Academia</span>
                      </button>
                    </div>

                    <div className="space-y-2">
                      <label className="block text-[11px] font-semibold text-slate-400">Logo del Negocio (Enlace URL o Subir Archivo)</label>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="https://ejemplo.com/logo.png"
                          value={logoUrl.startsWith('data:') ? '[Imagen cargada desde archivo]' : logoUrl}
                          onChange={(e) => setLogoUrl(e.target.value)}
                          className={`w-full text-xs px-3 py-2 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                        />
                        <label className="cursor-pointer px-3 py-2 rounded-lg bg-pink-500/10 hover:bg-pink-500/20 text-pink-500 text-xs font-bold border border-pink-500/20 flex items-center justify-center whitespace-nowrap transition">
                          📁 Subir foto
                          <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                        </label>
                      </div>
                    </div>
                  </div>

                  <div className={`p-5 rounded-2xl border shadow-sm space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <h2 className="text-xs font-bold uppercase tracking-wider text-pink-500 flex items-center space-x-1.5">
                      <IconFileText />
                      <span>Datos del Comprobante</span>
                    </h2>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-400">N° Factura *</label>
                        <input
                          type="text"
                          value={invoiceNumber}
                          onChange={(e) => setInvoiceNumber(e.target.value)}
                          className={`w-full text-xs px-3 py-2 rounded-lg font-bold outline-none border ${errors.invoiceNumber ? 'border-rose-500' : isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-400">Emisión</label>
                        <input
                          type="date"
                          value={invoiceDate}
                          onChange={(e) => setInvoiceDate(e.target.value)}
                          className={`w-full text-xs px-2.5 py-2 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-400">Vencimiento</label>
                        <input
                          type="date"
                          value={dueDate}
                          onChange={(e) => setDueDate(e.target.value)}
                          className={`w-full text-xs px-2.5 py-2 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                        />
                      </div>
                    </div>
                  </div>

                  <div className={`p-5 rounded-2xl border shadow-sm space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <h2 className="text-xs font-bold uppercase tracking-wider text-pink-500 flex items-center space-x-1.5">
                      <IconUser />
                      <span>Datos del Cliente *</span>
                    </h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-400">Nombre / Razón Social *</label>
                        <input
                          type="text"
                          placeholder="Ej: María Delgado"
                          value={clientName}
                          onChange={(e) => setClientName(e.target.value)}
                          className={`w-full text-xs px-3 py-2 rounded-lg outline-none border ${errors.clientName ? 'border-rose-500' : isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-400">C.I. / RIF</label>
                        <input
                          type="text"
                          placeholder="Ej: V-12345678"
                          value={clientDoc}
                          onChange={(e) => setClientDoc(e.target.value)}
                          className={`w-full text-xs px-3 py-2 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-400">Teléfono</label>
                        <input
                          type="text"
                          placeholder="Ej: +58 412 1234567"
                          value={clientPhone}
                          onChange={(e) => setClientPhone(e.target.value)}
                          className={`w-full text-xs px-3 py-2 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1 text-slate-400">Dirección</label>
                        <input
                          type="text"
                          placeholder="Ej: Barquisimeto, Lara"
                          value={clientAddress}
                          onChange={(e) => setClientAddress(e.target.value)}
                          className={`w-full text-xs px-3 py-2 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                        />
                      </div>
                    </div>
                  </div>

                  <div className={`p-5 rounded-2xl border shadow-sm space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <div className="flex items-center justify-between">
                      <h2 className="text-xs font-bold uppercase tracking-wider text-pink-500 flex items-center space-x-1.5">
                        <IconFileText />
                        <span>Productos o Servicios</span>
                      </h2>
                      <button
                        onClick={handleAddItem}
                        className="px-3 py-1.5 font-bold text-xs rounded-lg bg-pink-500/10 text-pink-500 hover:bg-pink-500/20 transition flex items-center space-x-1"
                      >
                        <IconPlus />
                        <span>Agregar Ítem</span>
                      </button>
                    </div>

                    <div className="space-y-3">
                      {items.map((item, index) => (
                        <div key={item.id} className={`p-3 rounded-xl border relative space-y-2 ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-pink-500/10 text-pink-400">
                              #{index + 1}
                            </span>
                            {items.length > 1 && (
                              <button onClick={() => handleRemoveItem(item.id)} className="text-slate-400 hover:text-rose-500 transition">
                                <IconTrash />
                              </button>
                            )}
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                            <div className="sm:col-span-6">
                              <input
                                type="text"
                                placeholder="Producto (Ej: Vestido Silk)"
                                value={item.title}
                                onChange={(e) => handleItemChange(item.id, 'title', e.target.value)}
                                className={`w-full text-xs font-semibold px-2.5 py-2 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-300 text-slate-800'}`}
                              />
                            </div>
                            <div className="sm:col-span-2">
                              <input
                                type="number"
                                min="1"
                                placeholder="Cant"
                                value={item.quantity || ''}
                                onChange={(e) => handleItemChange(item.id, 'quantity', e.target.value)}
                                className={`w-full text-xs text-center px-2 py-2 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-300 text-slate-800'}`}
                              />
                            </div>
                            <div className="sm:col-span-4">
                              <input
                                type="number"
                                step="0.01"
                                placeholder="Precio ($)"
                                value={item.price || ''}
                                onChange={(e) => handleItemChange(item.id, 'price', e.target.value)}
                                className={`w-full text-xs px-2.5 py-2 rounded-lg outline-none font-semibold text-right border ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-300 text-slate-800'}`}
                              />
                            </div>
                          </div>
                          <input
                            type="text"
                            placeholder="Detalle o Talla (Ej: Talla M / Color Beige)"
                            value={item.description}
                            onChange={(e) => handleItemChange(item.id, 'description', e.target.value)}
                            className={`w-full text-[11px] px-2.5 py-1.5 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-300' : 'bg-white border-slate-300 text-slate-600'}`}
                          />
                        </div>
                      ))}
                    </div>

                    <div className="pt-3 border-t flex items-center justify-between border-slate-800">
                      <span className="text-xs font-semibold text-slate-400">Descuento Especial (%):</span>
                      <input
                        type="number"
                        min="0"
                        max="100"
                        value={discountPercent || ''}
                        onChange={(e) => setDiscountPercent(e.target.value)}
                        className={`w-24 text-xs px-2 py-1.5 rounded-lg text-right font-bold outline-none border ${isDarkMode ? 'bg-slate-950 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                      />
                    </div>
                  </div>

                  <div className={`p-5 rounded-2xl border shadow-sm space-y-4 ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <h2 className="text-xs font-bold uppercase tracking-wider text-pink-500 flex items-center space-x-1.5">
                      <IconCreditCard />
                      <span>Cuentas de Pago & Notas</span>
                    </h2>
                    <div>
                      <label className="block text-[11px] font-semibold mb-1 text-slate-400">Datos Bancarios</label>
                      <textarea
                        rows="3"
                        value={paymentInfo}
                        onChange={(e) => setPaymentInfo(e.target.value)}
                        className={`w-full text-xs p-2.5 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold mb-1 text-slate-400">Notas Adicionales</label>
                      <textarea
                        rows="2"
                        value={notes}
                        onChange={(e) => notesSet(e.target.value)}
                        className={`w-full text-xs p-2.5 rounded-lg outline-none border ${isDarkMode ? 'bg-slate-950 border-slate-700 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-800'}`}
                      />
                    </div>
                  </div>

                </div>

                <div className={`lg:col-span-6 p-4 sm:p-6 rounded-2xl flex flex-col items-center justify-start border shadow-xl ${isDarkMode ? 'bg-slate-900/50 border-slate-800' : 'bg-slate-900 border-slate-800'}`}>
                  <div className="w-full max-w-[550px] mb-3 flex items-center justify-between text-slate-400 text-xs">
                    <span className="flex items-center space-x-1.5 font-medium">
                      <IconEye className="text-pink-400" />
                      <span>Vista Previa en Vivo</span>
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                      Plantilla: <strong className="uppercase text-pink-400">{templateStyle}</strong>
                    </span>
                  </div>

                  <div className="w-full max-w-[550px] rounded-2xl shadow-2xl overflow-hidden border border-slate-800 bg-white text-slate-800 print-area">
                    <div className={`p-6 sm:p-8 ${
                      templateStyle === 'darkacademia' 
                        ? 'bg-[#1a1816] text-[#f4eee2] border-b border-[#3a342f]' 
                        : templateStyle === 'minimal' 
                        ? 'bg-white text-slate-900 border-b border-slate-200' 
                        : 'bg-gradient-to-r from-slate-900 to-slate-800 text-white'
                    }`}>
                      <div className="flex justify-between items-start gap-4">
                        <div className="space-y-1">
                          {logoUrl ? (
                            <img src={logoUrl} alt="Logo" className="h-12 w-auto object-contain mb-1 rounded" onError={(e)=>{e.target.style.display='none'}} />
                          ) : (
                            <h1 className="text-xl font-black tracking-widest uppercase font-serif">
                              ARI FASHION
                            </h1>
                          )}
                          <p className={`text-[10px] ${templateStyle === 'darkacademia' ? 'text-[#c8b9a6]' : 'text-slate-300'}`}>
                            Boutique online de ropa, calzado y accesorios.<br />
                            Barquisimeto, Lara - Venezuela.
                          </p>
                        </div>
                        <div className="text-right">
                          <span className="inline-block px-2.5 py-0.5 rounded font-bold text-xs uppercase bg-pink-500 text-white mb-1">
                            FACTURA
                          </span>
                          <div className="font-mono font-bold text-sm">#{invoiceNumber || '0001'}</div>
                          <div className="text-[10px] opacity-80 mt-0.5">Emisión: {invoiceDate}</div>
                          {dueDate && <div className="text-[10px] opacity-80">Vence: {dueDate}</div>}
                          <div className="text-[9px] opacity-60 mt-1">Tasa: Bs. {exchangeRate.toFixed(2)}</div>
                        </div>
                      </div>
                    </div>

                    <div className="p-6 sm:p-8 space-y-6 bg-white text-slate-800">
                      <div className="p-4 rounded-xl bg-slate-50 border border-slate-100 flex justify-between items-start text-xs">
                        <div>
                          <p className="font-bold text-slate-900 text-sm">{clientName || 'Nombre del Cliente'}</p>
                          <p className="text-slate-600 mt-0.5">{clientDoc ? `CI/RIF: ${clientDoc}` : 'CI/RIF: Sin especificar'}</p>
                        </div>
                        <div className="text-right text-slate-600">
                          <p>{clientPhone || 'Teléfono no registrado'}</p>
                          <p className="mt-0.5">{clientAddress || 'Dirección de entrega'}</p>
                        </div>
                      </div>

                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b-2 border-pink-100 text-[10px] uppercase tracking-wider text-slate-400">
                            <th className="pb-2 font-bold">Descripción</th>
                            <th className="pb-2 font-bold text-center w-12">Cant.</th>
                            <th className="pb-2 font-bold text-right w-24">P. Unit</th>
                            <th className="pb-2 font-bold text-right w-28">Total</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-xs">
                          {items.map((item, idx) => {
                            const qty = Number(item.quantity) || 0;
                            const price = Number(item.price) || 0;
                            const tUSD = qty * price;
                            const tVES = tUSD * exchangeRate;
                            return (
                              <tr key={idx}>
                                <td className="py-2.5 pr-2">
                                  <p className="font-bold text-slate-900">{item.title || 'Producto sin título'}</p>
                                  {item.description && <p className="text-[10px] text-slate-500">{item.description}</p>}
                                </td>
                                <td className="py-2.5 text-center font-medium text-slate-700">{qty}</td>
                                <td className="py-2.5 text-right font-medium text-slate-700">$ {price.toFixed(2)}</td>
                                <td className="py-2.5 text-right">{renderMoney(tUSD, tVES)}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>

                      <div className="pt-4 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-12 gap-4">
                        <div className="sm:col-span-7 space-y-2 text-[10px] text-slate-600">
                          {paymentInfo && (
                            <div className="p-3 rounded-lg bg-pink-50/50 border border-pink-100">
                              <p className="font-bold uppercase tracking-wider text-pink-600 mb-1">Métodos de Pago:</p>
                              <p className="whitespace-pre-line leading-tight">{paymentInfo}</p>
                            </div>
                          )}
                          {notes && <p className="italic text-slate-500">{notes}</p>}
                        </div>

                        <div className="sm:col-span-5 space-y-1.5 text-right text-xs">
                          <div className="flex justify-between text-slate-600">
                            <span>Subtotal:</span>
                            <span>{renderMoney(subtotalUSD, subtotalVES)}</span>
                          </div>
                          {Number(discountPercent) > 0 && (
                            <div className="flex justify-between text-pink-600 font-semibold">
                              <span>Descuento ({discountPercent}%):</span>
                              <span>- {renderMoney(discountUSD, discountVES)}</span>
                            </div>
                          )}
                          <div className="p-3 rounded-xl bg-slate-900 text-white flex justify-between items-center mt-2">
                            <span className="text-[10px] uppercase font-bold tracking-wider text-pink-400">Total</span>
                            <div className="text-right">
                              <div className="text-sm font-black">$ {totalUSD.toFixed(2)}</div>
                              <div className="text-[10px] text-slate-300">Bs. {totalVES.toFixed(2)}</div>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="mt-8 pt-4 border-t border-slate-100 text-center text-[10px] text-slate-400 font-medium">
                        ¡Gracias por tu compra en Ari Fashion! ✨
                      </div>

                    </div>
                  </div>

                  <div className="w-full max-w-[550px] mt-4">
                    <button
                      onClick={handleSaveAndEmit}
                      className="w-full py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black text-sm rounded-xl shadow-xl shadow-pink-950 transition transform hover:-translate-y-0.5 flex items-center justify-center space-x-2"
                    >
                      <IconCheck />
                      <span>Emitir, Guardar en Historial e Imprimir / PDF</span>
                    </button>
                  </div>

                </div>

              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
